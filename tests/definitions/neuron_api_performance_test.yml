# Neuron API Performance Test
#
# Use Case: Performance testing for Neuron API endpoints
# Tools: JMeter
# Description: Tests Fleet Summary, IFE Events, and Analytics IFE Overview APIs
# 
# This test onboards the existing JMX file with 3 thread groups:
# 1. Fleet Summary (5 threads, 1 loop)
# 2. IFE Events (10 threads, 1 second ramp-up, 1 loop)
# 3. Analytics IFE Overview (10 threads, 1 loop)

test_info:
  test_suite_name: "Neuron API Performance Test"
  test_suite_type: "unified"
  description: "Performance testing for Neuron Visualization APIs including Fleet Summary, IFE Events, and Analytics"
  version: "1.0"
  environment: "gamma"
  base_url: "https://gamma.hub.quvia.ai"

# JMeter Tests in YAML format
# This provides the same functionality as the JMX file but in APT YAML format
jmeter_tests:
  
  fleet_summary_test:
    tool: "jmeter"
    scenarios:
      - name: "Fleet Summary API"
        url: "https://gamma.hub.quvia.ai/neuron-api/visualization/api/fleet-summary/get-metrics/v3"
        method: "POST"
        headers:
          Content-Type: "application/json"
          Authorization: "Bearer eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJhZG1pbiIsInJvbGVzIjpbIlJPTEVfQURNSU4iXSwiZW1haWxfdmVyaWZpZWQiOnRydWUsInBhc3N3b3JkX2V4cGlyZWQiOnRydWUsImlzcyI6Ind3dy5lc3BhY2VuZXR3b3Jrcy5pbyIsImlhdCI6MTc2OTAxODQyMywiZXhwIjoxNzY5MDYzNDIzfQ.ov72_rEkmyHXDqLZGNh5xj6YIj0u6tVtLJ3N2TUZZBBqfSVN-MtvPS4P51NsgHhPkpEuHEUnJMETbS7aPS2xOBcWAsig0mPz4pX_qTGgld8SYC_hLe0zkceG3QxJ4NnmGaZYrU4XXkCZBLS9dMADKZRpRRbud4W_l4TC79gc0r2HPFl8lXT1Mn7fG_ncE7rYdOiLV56LtZZM8XsW3NRIEW-FlVdGwgijoReJHs_JqiqnXZ9ENmzgdBXr43hk-mUEDbiJEB_yaYNIYy0r86jMtsgFrDVCkoKOezwH-yjUCOSB8dGAt4w2HrdisKtX9_cTpHnBOlxd__D8xyjpoHZPDQ"
        body: |
          {
            "flightStatuses": {
              "include": ["active"],
              "exclude": []
            },
            "timeRange": {
              "timeframe": "-1800|seconds"
            },
            "enabledMetrics": [
              "eqoemin.packet_loss",
              "eqoemin.packet_loss_down",
              "liveseatmin.login_avl"
            ],
            "includeFirstLast": false,
            "includeTripActive": false
          }
    
    
    thread_group_config:
      num_threads: 5
      ramp_time: 0
      loops: 3  # Retry 3 times to handle intermittent failures
      
    # JMeter HTTP settings to handle intermittent SSL/connection issues
    http_config:
      connect_timeout: 30000  # 30 seconds
      response_timeout: 60000  # 60 seconds
      retry_on_error: true
      max_retries: 2
  
