# Performance thresholds
thresholds:
  jmeter:
    response_time_p95: 2000  # 95th percentile < 2 seconds
    response_time_p99: 5000  # 99th percentile < 5 seconds
    error_rate: 0.01         # Error rate < 1%
    throughput_min: 10       # Minimum 10 requests/second

# Reporting configuration
reporting:
  output_dir: "performance_results/neuron_api_test"
  include:
    - jmeter
  formats:
    - html
    - csv
    - json
  generate_charts: true
  compare_with_baseline: false

# Environment variables (set these before running)
# export AUTH_TOKEN="your_bearer_token_here"
