# QPT Comprehensive Demo
#
# This test incorporates all key QPT features:
# 1. Parallel Execution Groups
# 2. Declarative Mode (JMeter)
# 3. File-Based Execution (k6)
# 4. Smart Resolution (Method & File)
# 5. Inline Code Execution
# 6. Global Agent Pool (agents loaded from config/agents.yml)

test_info:
  test_suite_name: "QPT Full Feature Showcase"
  description: "Demonstrating Parallelism, Smart Resolution, and Multi-Mode Agents"
  version: "4.0"
  test_suite_type: "unified"

# ✅ NO AGENTS SECTION - All agents loaded from config/agents.yml

workflows:
  # ──────────────────────────────────────────────────────────────────
  # GROUP A: PARALLEL LOAD TESTING
  # Running JMeter (Declarative) and k6 (File-Based) simultaneously
  # ──────────────────────────────────────────────────────────────────
  parallel_load_phase_us: # sanity, load
    group: "global_load_attack"
    steps:
      - name: jmeter_declarative_load
        action: jmeter_test
        agent: jmeter-server
        jmeter_config:
          thread_group_config:
            threads: 5
            ramp_time: 1
            duration: 5
          scenarios:
            - name: "Declarative API"
              url: "https://httpbin.org/get"
              method: "GET"

  parallel_load_phase_eu: # load
    group: "global_load_attack"
    steps:
      - name: k6_file_based_load
        action: k6_test
        agent: k6-server
        k6_script_file: "examples/scripts/my_k6_test.js"  # Explicit file path

  # ──────────────────────────────────────────────────────────────────
  # GROUP B: SMART RESOLUTION & MAINTENANCE (Sequential)
  # ──────────────────────────────────────────────────────────────────
  maintenance_flow: # maintenance
    iterations: 5
    steps:
      # 1. Method Resolution: Finds 'custom_validation' in examples/performance_scripts.py
      - name: custom_validation
        action: agent_execute
        agent: jmeter-server
        context:
          env: "production"

      # 2. File Resolution: Finds 'remote_cleanup.py' in examples/agent_scripts/
      - name: remote_cleanup
        action: agent_execute
        agent: k6-server
      
      # 3. Inline Code Execution with Threads
      - name: inline_check
        action: agent_execute
        agent: jmeter-server
        threads: 3  # NEW: 3 concurrent executions
        code: |
          import platform
          import os
          import time
          thread_id = context.get('thread_id', 0)
          print(f"Thread {thread_id} running on {platform.node()} in {os.getcwd()}")
          time.sleep(0.5)  # Simulate work
          result = {"host": platform.node(), "status": "online", "thread_id": thread_id}

  # ──────────────────────────────────────────────────────────────────
  # GROUP D: API CALL WITH THREADS (NEW FEATURE DEMO)
  # Demonstrating concurrent API calls with threads parameter
  # ──────────────────────────────────────────────────────────────────
  api_load_testing: # api, load
    iterations: 2  # Workflow runs 2 times
    steps:
      # 1. Single thread API call (baseline)
      - name: baseline_api_call
        action: api_call
        url: "https://jsonplaceholder.typicode.com/todos/1"
        method: GET
        # threads: 1 (default)
        # Total: 1 thread × 2 workflow iterations = 2 requests
      
      # 2. Multi-threaded API call
      - name: concurrent_api_call
        action: api_call
        url: "https://jsonplaceholder.typicode.com/posts"
        method: GET
        threads: 5  # NEW: 5 concurrent requests
        # Total: 5 threads × 2 workflow iterations = 10 requests
      
      # 3. High-load API call with iterations
      - name: high_load_api_call
        action: api_call
        url: "https://jsonplaceholder.typicode.com/users"
        method: GET
        threads: 10  # 10 concurrent threads
        iterations: 3  # Repeat 3 times
        # Total: 10 threads × 3 iterations × 2 workflow iterations = 60 requests


  # ──────────────────────────────────────────────────────────────────
  # GROUP C: JMETER JMX DIRECT EXECUTION
  # ──────────────────────────────────────────────────────────────────
  jmx_direct_run: # jmx, performance
    steps:
      - name: jmeter_jmx_run
        action: jmeter_test
        agent: jmeter-server
        jmx_file: "../jmx_files/api_test_plan.jmx"

reporting:
  output_dir: "performance_results/comprehensive_demo"
  include:
    - workflows
  formats:
    - html
    - json
