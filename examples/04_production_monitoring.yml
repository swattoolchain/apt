# Example 4: Production Monitoring with Remote Agent
#
# Use Case: Monitor production application from internal network
# Tools: Remote Agent (deployed on production network)
# Demonstrates: Production monitoring, database queries, internal API checks
#
# Prerequisites:
# 1. Deploy agent on production network:
#    qptcli agent create --name prod-monitor --type docker --mode emit --emit-target influxdb://metrics.company.com:8086/prod
#    qptcli agent deploy --name prod-monitor --target admin@prod-server.com --type docker
#
# 2. Set environment variable:
#    export PROD_MONITOR_ENDPOINT="http://prod-server.com:9090"
#    export PROD_MONITOR_TOKEN="your-token"
# ✅ Agents loaded from config/agents.yml (Global Agent Pool)

test_info:
  test_suite_name: Production Monitoring
  description: Monitor production application health and performance
  version: '2.0'
workflows:
  production_health_check:
    iterations: 1
    steps:
    - name: internal_api_health
      agent: prod-monitor
      code: "import requests\nimport time\n\nstart = time.time()\nresponse = requests.get(\"\
        http://localhost:8080/internal/health\")\nduration = time.time() - start\n\
        \nresult = {\n  \"duration\": duration,\n  \"status_code\": response.status_code,\n\
        \  \"healthy\": response.status_code == 200,\n  \"check_type\": \"internal_api\"\
        \n}\n"
    - name: database_connectivity
      agent: prod-monitor
      code: "import time\n# Note: Install psycopg2 on agent if using PostgreSQL\n\
        # import psycopg2\n\nstart = time.time()\n# conn = psycopg2.connect(\"dbname=prod\
        \ user=readonly host=localhost\")\n# cursor = conn.cursor()\n# cursor.execute(\"\
        SELECT 1\")\n# cursor.fetchone()\n# conn.close()\nduration = time.time() -\
        \ start\n\nresult = {\n  \"duration\": duration,\n  \"connected\": True,\n\
        \  \"check_type\": \"database\"\n}\n"
    - name: redis_connectivity
      agent: prod-monitor
      code: "import time\n# Note: Install redis on agent if using Redis\n# import\
        \ redis\n\nstart = time.time()\n# r = redis.Redis(host='localhost', port=6379,\
        \ db=0)\n# r.ping()\nduration = time.time() - start\n\nresult = {\n  \"duration\"\
        : duration,\n  \"connected\": True,\n  \"check_type\": \"redis\"\n}\n"
    - name: external_api_check
      agent: prod-monitor
      code: "import requests\nimport time\n\nstart = time.time()\nresponse = requests.get(\"\
        https://api.external-service.com/health\")\nduration = time.time() - start\n\
        \nresult = {\n  \"duration\": duration,\n  \"status_code\": response.status_code,\n\
        \  \"healthy\": response.status_code == 200,\n  \"check_type\": \"external_api\"\
        \n}\n"
reporting:
  output_dir: performance_results/04_production_monitoring
  include:
  - workflows
