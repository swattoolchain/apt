# Example 6: External Agent Code Files
#
# Use Case: Using external code files instead of inline code
# Tools: Remote Agents with external scripts
# Demonstrates: Multi-language support, code reusability
#
# Prerequisites:
# 1. Deploy agent:
#    qptcli agent create --name prod-agent --type docker --mode emit
#    qptcli agent deploy --name prod-agent --target user@server.com --type docker
#
# 2. Set environment variable:
#    export PROD_AGENT_ENDPOINT="http://server.com:9090"
#    export PROD_AGENT_TOKEN="your-token"
# ✅ Agents loaded from config/agents.yml (Global Agent Pool)

test_info:
  test_suite_name: External Agent Code Files
  description: Demonstrates using external code files with agents
  version: '2.0'
workflows:
  external_code_demo:
    iterations: 3
    steps:
    - name: health_check
      agent: prod-agent
      code_file: src/test_scripts/health_check.py
    - name: database_check
      agent: prod-agent
      code_file: src/test_scripts/database_check.py
    - name: system_metrics
      agent: prod-agent
      code_file: src/test_scripts/system_metrics.sh
      language: shell
reporting:
  output_dir: performance_results/06_external_code
  include:
  - workflows
