# Example 9: Async Distributed Testing with Browser Contexts
#
# Use Case: Long-running browser performance tests across multiple regions
# Features: Async agents, browser contexts, job queue, priority scheduling
# Demonstrates: Latest APT framework capabilities
# ✅ Agents loaded from config/agents.yml (Global Agent Pool)

test_info:
  test_suite_name: Async Distributed Browser Testing
  description: 30-minute browser performance test using async agents and browser contexts
  version: '3.0'
workflows:
  browser_performance_test:
    iterations: 50
    concurrency: 15
    steps:
    - name: us_east_browsers
      agent: us-east-agent
      priority: high
      code: "from playwright.async_api import async_playwright\nimport asyncio\nimport\
        \ time\n\nasync def run_test():\n    async with async_playwright() as p:\n\
        \        # Single browser instance\n        browser = await p.chromium.launch(headless=True)\n\
        \        \n        # Create isolated context (like incognito)\n        context\
        \ = await browser.new_context(\n            viewport={'width': 1920, 'height':\
        \ 1080},\n            user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64)'\n\
        \        )\n        \n        # Create page in context\n        page = await\
        \ context.new_page()\n        \n        # Measure performance\n        start\
        \ = time.time()\n        await page.goto(\"https://your-app.com\")\n     \
        \   await page.wait_for_load_state(\"networkidle\")\n        load_time = time.time()\
        \ - start\n        \n        # Get metrics\n        metrics = await page.evaluate(\"\
        \"\"\n            () => {\n                const timing = performance.timing;\n\
        \                return {\n                    load_time: timing.loadEventEnd\
        \ - timing.navigationStart,\n                    dom_ready: timing.domContentLoadedEventEnd\
        \ - timing.navigationStart,\n                    ttfb: timing.responseStart\
        \ - timing.requestStart\n                };\n            }\n        \"\"\"\
        )\n        \n        # Cleanup\n        await context.close()\n        await\
        \ browser.close()\n        \n        return {\n            \"region\": \"\
        us-east\",\n            \"load_time\": load_time,\n            \"metrics\"\
        : metrics\n        }\n\nresult = asyncio.run(run_test())\n"
    - name: eu_west_browsers
      agent: eu-west-agent
      priority: high
      code: "from playwright.async_api import async_playwright\nimport asyncio\nimport\
        \ time\n\nasync def run_test():\n    async with async_playwright() as p:\n\
        \        browser = await p.chromium.launch(headless=True)\n        context\
        \ = await browser.new_context(\n            viewport={'width': 1920, 'height':\
        \ 1080}\n        )\n        page = await context.new_page()\n        \n  \
        \      start = time.time()\n        await page.goto(\"https://your-app.com\"\
        )\n        await page.wait_for_load_state(\"networkidle\")\n        load_time\
        \ = time.time() - start\n        \n        metrics = await page.evaluate(\"\
        \"\"\n            () => ({\n                load_time: performance.timing.loadEventEnd\
        \ - performance.timing.navigationStart,\n                dom_ready: performance.timing.domContentLoadedEventEnd\
        \ - performance.timing.navigationStart\n            })\n        \"\"\")\n\
        \        \n        await context.close()\n        await browser.close()\n\
        \        \n        return {\n            \"region\": \"eu-west\",\n      \
        \      \"load_time\": load_time,\n            \"metrics\": metrics\n     \
        \   }\n\nresult = asyncio.run(run_test())\n"
reporting:
  output_dir: performance_results/09_async_distributed
  formats:
  - html
  - json
  include:
  - workflows
  - summary
