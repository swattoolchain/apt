# Example 3: Multi-Region Distributed Test
#
# Use Case: Test API latency from multiple geographic regions
# Tools: Remote Agents
# Demonstrates: Distributed testing with agent_execute
#
# Prerequisites:
# 1. Deploy agents in different regions:
#    qptcli agent create --name us-east --type docker --mode emit
#    qptcli agent deploy --name us-east --target user@us-server.com --type docker
#
# 2. Set environment variables:
#    export US_EAST_ENDPOINT="http://us-server.com:9090"
#    export US_EAST_TOKEN="your-token"
#    export EU_WEST_ENDPOINT="http://eu-server.com:9090"
#    export EU_WEST_TOKEN="your-token"
# ✅ Agents loaded from config/agents.yml (Global Agent Pool)

test_info:
  test_suite_name: Multi-Region Latency Test
  description: Test API performance from multiple geographic locations
  version: '2.0'
workflows:
  global_latency_test:
    iterations: 10
    steps:
    - name: test_from_us_east
      agent: us-east-agent
      code: "import requests\nimport time\n\nstart = time.time()\nresponse = requests.get(\"\
        https://api.example.com/health\")\nduration = time.time() - start\n\nresult\
        \ = {\n  \"duration\": duration,\n  \"status_code\": response.status_code,\n\
        \  \"region\": \"us-east\",\n  \"timestamp\": time.time()\n}\n"
    - name: test_from_eu_west
      agent: eu-west-agent
      code: "import requests\nimport time\n\nstart = time.time()\nresponse = requests.get(\"\
        https://api.example.com/health\")\nduration = time.time() - start\n\nresult\
        \ = {\n  \"duration\": duration,\n  \"status_code\": response.status_code,\n\
        \  \"region\": \"eu-west\",\n  \"timestamp\": time.time()\n}\n"
reporting:
  output_dir: performance_results/03_multi_region
  include:
  - workflows
